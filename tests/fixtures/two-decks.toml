# Two freedj decks, each to its own pair of channels.  Deck 0 plays at 3 s,
# deck 1 (pitched up 6 %) at 8 s: each must be silent until its own PLAY.
sample_rate = 48000
block = 256

[[deck]]
plugin = "~/.clap/OpenDeck.clap"
track  = "TRACK_A"
out    = [0, 1]

[[deck]]
plugin = "~/.clap/OpenDeck.clap"
track  = "TRACK_B"
out    = [2, 3]

[[step]]
at = 3.0
deck = 0
play = true

[[step]]
at = 7.5
deck = 1
pitch = 6.0

[[step]]
at = 8.0
deck = 1
play = true

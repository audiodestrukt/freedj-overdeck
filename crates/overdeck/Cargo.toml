[package]
name        = "overdeck"
description = "Overdeck: a plugin host for decks. Runs freedj-3000 decks (CLAP) on a Raspberry Pi 5, owns the hardware, speaks ODP to the decks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
odp        = { workspace = true }
clap-host  = { workspace = true }
surface    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
log        = { workspace = true }
anyhow     = { workspace = true }
toml       = "0.8"
cpal       = "0.15"
rtrb       = "0.3"
hound      = "3.5"
env_logger = "0.11"

[dev-dependencies]
hound = "3.5"
